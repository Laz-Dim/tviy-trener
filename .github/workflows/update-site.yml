name: Update Site Data & Deploy

on:
  push:
    branches:
      - main
      - v2
    paths:
      - 'blog_posts.json'
  schedule:
    - cron: '0 6 * * *'  # щоденно о 06:00 UTC
  workflow_dispatch:      # ручний запуск

permissions:
  contents: write  # потрібно для пушу комітів

concurrency:
  group: site-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Update Data, Generate Blog & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch videos from YouTube (on schedule or manual trigger)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python get_videos.py

      - name: Generate blog pages + sitemap
        run: python generate_blog.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos_data.json blog-*.html sitemap.xml blog_posts.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update blog pages, sitemap & videos [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      - name: Deploy current branch to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "v2" ]; then
            npx --yes wrangler pages deploy . --project-name tviy-trener-v2 --branch v2
          else
            npx --yes wrangler pages deploy . --project-name tviy-trener --branch main
          fi

      - name: Sync videos_data.json and blog_posts.json to v2 on schedule
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp videos_data.json /tmp/videos_data.json
          cp blog_posts.json /tmp/blog_posts.json
          git checkout v2
          git pull --rebase origin v2
          cp /tmp/videos_data.json videos_data.json
          cp /tmp/blog_posts.json blog_posts.json
          python generate_blog.py
          git add videos_data.json blog-*.html sitemap.xml blog_posts.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync videos & blog data to v2 [skip ci]"
            git push origin v2
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler pages deploy . --project-name tviy-trener-v2 --branch v2
          fi
